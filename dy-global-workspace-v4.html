// 단계별 시간은 이 비율로 나눈 가정이고, 화면에 그렇게 적습니다. g는 바뀐 뒤 사람이 확인하는 곳의 수입니다.
const SIM={st:['② 문의','③④ 안내·견적','⑤ 확정·입금·장부','⑥ 출고','⑦⑩ 명세서·마감'],w:[1,2,5,1,1],g:[1,2,3,1,2],D:20,K:.06,tr:.3,on:0,t0:0,O:[],end:0};
const simOrd=m=>{const W=SIM.w.reduce((a,b)=>a+b,0),n=Math.min(Math.max(0,CV.n|0),400);return Array.from({length:n},(_,k)=>({a:(k+.5)/n*SIM.D*.85,d:SIM.w.map(w=>Math.max(0,m)*w/W*SIM.K)}))};
function simAt(o,t){let x=t-o.a;if(x<0)return null;for(let s=0;s<5;s++){if(x<o.d[s])return{s};x-=o.d[s];if(s<4){if(x<SIM.tr)return{s,f:x/SIM.tr};x-=SIM.tr}}return{z:1}}
function simWork(o,t){let x=Math.max(0,t-o.a),w=0;for(let s=0;s<5&&x>0;s++){w+=Math.min(x,o.d[s]);x-=o.d[s]+SIM.tr}return w/SIM.K}
function simData(){SIM.O=[simOrd(CV.now),simOrd(CV.goal)];SIM.end=Math.max(SIM.D,...SIM.O.flat().map(o=>o.a+o.d.reduce((p,q)=>p+q,0)+4*SIM.tr))}
function simDraw(t){const c=$('#sim');if(!c)return[0,0];const W=c.clientWidth,H=290,r=devicePixelRatio||1;if(c.width!=Math.round(W*r)){c.width=Math.round(W*r);c.height=H*r}
 const g=c.getContext('2d'),F='system-ui,-apple-system,sans-serif';g.setTransform(r,0,0,r,0,0);g.clearRect(0,0,W,H);
 const x0=112,x1=W-150,sw=(x1-x0)/5,bw=sw-22,bh=104,LN=[{y:12,m:CV.now,c:'#e8912d',l:'지금'},{y:162,m:CV.goal,c:'#39063a',l:'바뀐 뒤'}],k=CV.n>0?CV.n/Math.min(CV.n,400):0,res=[];
 LN.forEach((ln,li)=>{const O=SIM.O[li]||[],cnt=[0,0,0,0,0];
  g.textBaseline='alphabetic';g.fillStyle='#1d1c1d';g.font=`800 16px ${F}`;g.fillText(ln.l,6,ln.y+46);g.fillStyle='#616061';g.font=`13px ${F}`;g.fillText(`한 건 ${ln.m}분`,6,ln.y+66);
  for(let s=0;s<5;s++){const bx=x0+s*sw,hot=li==0&&s==2;g.fillStyle=hot?'#fffaeb':'#f8f8f8';g.strokeStyle=hot?'#ecb22e':'#e6e6eb';g.lineWidth=hot?2:1;g.beginPath();g.roundRect?g.roundRect(bx,ln.y,bw,bh,10):g.rect(bx,ln.y,bw,bh);g.fill();g.stroke();
   g.fillStyle='#1d1c1d';g.font=`700 12px ${F}`;g.fillText(SIM.st[s],bx+8,ln.y+18);
   if(li==1){const h='✋'.repeat(SIM.g[s]);g.font=`11px ${F}`;g.fillText(h,bx+bw-6-g.measureText(h).width,ln.y+bh-8)}
   if(s<4){g.strokeStyle='#d0d0d6';g.lineWidth=1;g.beginPath();g.moveTo(bx+bw,ln.y+bh/2);g.lineTo(bx+sw,ln.y+bh/2);g.stroke()}}
  if(li==0){g.fillStyle='#8a6d00';g.font=`700 11px ${F}`;g.fillText('돈과 장부가 몰리는 곳',x0+2*sw+8,ln.y+bh+15)}
  const cols=Math.max(1,Math.floor((bw-16)/9)),cap=cols*Math.floor((bh-32)/9);let mins=0;g.fillStyle=ln.c;
  for(const o of O){mins+=simWork(o,t);const p=simAt(o,t);if(!p||p.z)continue;
   if(p.f==null){const i=cnt[p.s]++;if(i<cap){g.beginPath();g.arc(x0+p.s*sw+12+(i%cols)*9,ln.y+31+Math.floor(i/cols)*9,3.5,0,7);g.fill()}}
   else{const ax=x0+p.s*sw+bw,ex=x0+(p.s+1)*sw;g.beginPath();g.arc(ax+(ex-ax)*p.f,ln.y+bh/2,3.5,0,7);g.fill()}}
  g.font=`700 11px ${F}`;for(let s=0;s<5;s++)if(cnt[s]>cap){g.fillStyle='#616061';g.fillText('+'+(cnt[s]-cap),x0+s*sw+bw-34,ln.y+bh-8)}
  const hrs=mins*k/60;res.push(hrs);
  g.fillStyle='#616061';g.font=`12px ${F}`;g.fillText('쌓인 사람 시간',x1+12,ln.y+40);g.fillStyle=ln.c;g.font=`900 28px ${F}`;g.fillText(Math.round(hrs).toLocaleString()+'시간',x1+12,ln.y+74)});
 return res}

${sdc()}
<div class=sdl><span><b>📦 데이터</b>대상 10가지와 관계</span><span><b>⚙ 규칙</b>금액·대조·상태는 코드가</span><span><b>✋ 행동</b>사람 확인 10곳</span><span><b>🔒 권한</b>채널 멤버만 보고, AI도 같음</span><span><b>₩ 게이트</b>입금 확인 뒤에만 출고</span><span class=h>카드를 누르면 자세히 봅니다</span></div></div>`}
function pDemo(){return `<div class=pg><div class=ey>시연 · 화면은 SJ Station</div><h1>실제로 돌아가는 모습</h1><p class=lead>앞에서 본 실제 거래 한 건이 이렇게 바뀝니다. 매직스톤도 같은 흐름이고, 계산 규칙과 배송만 다릅니다. 회사, 거래처, 금액은 모두 예시입니다. ← → 키로 장면을 넘깁니다.</p>
<div class=scg>${SC.map((s,i)=>`<div class="sc${i?'':' main'}" onclick="stepTo(${i},0)"><div class=n>시나리오 ${i+1}${i?'':' · 메인'}</div><h3>${s.t}</h3><p>${s.s}</p><div class=ft>${av(s.who,18)} ${E(N(s.who))} 시점 <span class=pill>${s.steps.length}장면</span></div></div>`).join('')}<div class=sc onclick="docOpen(0)"><div class=n>문서</div><h3>견적서 · 명세서 · 계산서 요청 · 아침 보고</h3><p>고객과 회계부에 나가는 문서 3장과 대표님이 매일 받는 보고 1장. 숫자가 어디서 왔는지 옆에 붙습니다.</p><div class=ft>📄 <span class=pill>4장</span></div></div></div>
<p style="margin-top:18px"><button class=bt2 onclick="browse()">자유롭게 둘러보기</button></p></div>`}
const PRICE=null;
function pAsk(){return `<div class=pg><div class=ey>제안</div><h1>한 달 동안, <em>실제 주문</em>으로 확인하겠습니다</h1>
<div class=cards><div class=cd><b>범위</b><p>${E(FL[fsel].t)} 한 흐름. 홍보 → 문의 → 가격 안내·견적 → 확정·입금 → 출고 → 명세서·마감. 다른 사업은 이 흐름이 자리 잡은 뒤에 붙입니다.</p></div><div class="cd fx rp"><b>결과물 · 대표님 아침 보고 한 장</b><p>매일 아침 8시, 매출·새 문의·승인 대기·입금 대기·오늘 출고와 시범 기준을 한 장으로 받습니다. 숫자마다 근거가 붙고, 묻는 말에는 근거와 함께 답합니다.</p><div class=rpb><button onclick="docOpen(3)">📄 예시 한 장</button><button onclick="stepTo(1,0)">▶ 시연</button></div></div><div class=cd><b>성공 기준 · 회사가 정함</b><p>한 건 <span class=ex>${CV.now}분</span> → <span class=ex>${CV.goal}분</span>, 다시 입력하는 일 0건. 시작 전과 같은 방법으로 재서 비교하고, 그 값이 아침 보고에 함께 올라갑니다. 저희는 이 숫자로만 판단받습니다.</p></div></div>
<div class=tl3><div><i>시작 전</i><b>기준을 같이 정하고, 지금 시간을 잽니다</b>가격표·단가표, 재고 시트, 사람이 확인하는 10곳. AI는 이 기준을 따라 초안만 만들고, 금액은 가격표로 계산합니다.</div><div><i>한 달</i><b>실제 주문으로 돌립니다</b>지금 쓰시는 도구는 그대로 두고, 매일 아침 보고를 받습니다.</div><div><i>끝</i><b>같은 방법으로 다시 잽니다</b>성공 기준과 비교한 결과를 보고 다음 단계를 정합니다.</div></div></div>`}
function pTerms(){const o=FL[1-fsel].t;return `<div class=pg><div class=ey>조건과 다음 단계</div><h1>한 달 시범의 <em>조건</em></h1>
<div class=cards><div class="cd fx"><b>비용</b><p>시범도 유료입니다.</p><div class=pr>한 달 시범 ${PRICE?`<b>${E(PRICE)}</b>`:`<span class=ex>금액</span>`}</div></div><div class=cd><b>준비할 것</b><p>실제 문의·견적 샘플, 이카운트 연동 권한, 담당자 한 분.</p></div><div class=cd><b>하지 않는 것</b><ul><li>공장·설비 자동화는 이번 범위가 아닙니다.</li><li>AI는 금액을 정하지 않습니다. 금액은 가격표로 계산하고 사람이 승인합니다.</li><li>지금 쓰시는 도구를 바꾸라고 하지 않습니다.</li><li>지원은 평일 저녁과 주말에 합니다.</li></ul></div></div>
<div class=sv><b>운영 서버</b><div class=svr><div><i>시범</i>저희 서버에서 운영합니다</div><span>→</span><div><i>정식 계약</i>서울의 관리형 서버로 옮기거나</div><div><i>정식 계약</i>회사 서버에 직접 설치 · 견적 별도</div></div></div>
<div class=lad><div><b>지금</b>${E(FL[fsel].t)}</div><div><b>다음</b>${E(o)} · 야자매트 · 창호</div><div><b>그다음</b>PDS를 견적 단계에</div><div><b>이후</b>베트남, 처음부터 같은 구조로</div></div>
<div class=ask>오늘 정할 것 세 가지: 흐름 하나 · 성공 기준 · 시작일<small>처음 만든 흐름이 다른 사업의 틀이 됩니다. 금액은 지금 단계만 드립니다.</small></div></div>`}

// ---------- 시연 (SJ Station 화면) ----------
function rail(){const dm=isDM(),r=[['⌂','Home',`go(home())`,!dm],['💬','DMs',`go('gm')`,dm],['🔔','Activity'],['📄','Files'],['⋯','More']];
 $('#rail').innerHTML=`<div class=w>${WS[0]}</div>`+r.map(([i,l,a,on])=>`<button class="${on?'on':''}"${a?` onclick="${a}"`:''}><i>${i}</i>${l}</button>`).join('')}
function side(){const cs=CH.filter(c=>c.h.includes(who)).sort((a,b)=>a.n<b.n?-1:1),lk=(on,a,ic,l)=>`<a class="${on?'on':''}" onclick="${a}">${ic}<span>${l}</span></a>`;
 let h=`<div class=ws>${WS} <small>⌄</small></div><a class=mut><b>💬</b><span>Threads</span></a><a class=mut><b>➤</b><span>Drafts & sent</span></a>`;
 h+=`<div class=sec>▾ Channels</div>`+cs.map(c=>lk(cur==c.id,`go('${c.id}')`,`<b>${pre(c)}</b>`,c.n)).join('')+`<a class=mut><b>＋</b><span>Add channels</span></a>`;
 h+=`<div class=sec>▾ Direct messages</div>`+['lee','hong','choi'].filter(k=>k!=who).slice(0,2).map(k=>lk(cur=='u:'+k,`go('u:${k}')`,av(k,20),E(N(k)))).join('')+`<a class=mut><b>＋</b><span>Invite people</span></a>`;
 const ap=['gm','inq','ord'].concat(C('pr').h.includes(who)?['pr']:[],C('vnqc').h.includes(who)?['qc']:[]);
 h+=`<div class=sec>▾ Agents & apps</div>`+ap.map(k=>k=='gm'?lk(cur=='gm',`go('gm')`,av(k,20),A[k][0]):lk(cur=='a:'+k,`go('a:${k}')`,av(k,20),A[k][0])).join('');
 $('#side').innerHTML=h}
const comp=t=>`<div class=comp><div>${E(t)}</div><div class=tl>＋ Aa ☺ @ ⧉</div></div>`;
function list(){const bs=['전체',...new Set(L.map(r=>r[1]))];
 return `<div class=fc>${bs.map(b=>`<button class="${flt==b?'on':''}" onclick="flt='${b}';render()">${b}</button>`).join('')}</div><div style="padding:0 20px 20px;overflow:auto"><table class=lt><tr><th>거래처</th><th>사업</th><th>단계</th><th>금액(원)</th><th>담당</th><th>접수</th></tr>${L.filter(r=>flt=='전체'||r[1]==flt).map(r=>{const n=stage(r);return `<tr class="${r[5]?'r':''}" ${r[5]?`onclick="th('${r[5]}')"`:''}><td><b>${r[0]}</b></td><td>${r[1]}</td><td><span class="pill${n>=7?' ok2':''}">${lab(n)}</span>${r[8]?` <span class=pill>${r[8]}</span>`:''}</td><td>${r[4]}</td><td>${N(r[2])}</td><td>${r[3]}</td></tr>`}).join('')}</table></div>`}
function dmv(){const k=cur=='gm'?'gm':cur.slice(2),ap=!!A[k],sub=ap?A[k][4]:P[k][1];
 const ms=k=='gm'?(DMS[who]||[{u:'gm',t:'8:00 AM',x:`안녕하세요 ${N(who)} 님. ${N(who)} 님이 볼 수 있는 채널의 기록으로만 답합니다.`}]):[];
 return `<header>${av(k,24)}<h1>${E(N(k))}</h1>${ap?'<span class=ap>APP</span>':''}<span class=d>${E(sub)}</span></header><nav class=tabs><a class=on>💬 Messages</a>${ap?'<a>About</a>':''}</nav><div class=feed><div class=intro>${av(k,56)}<h2>${E(N(k))}</h2><p>${E(ap?sub:`This conversation is just between you and ${N(k)}.`)}</p></div>${feed(ms)}</div>`+comp(`Message ${N(k)}`)}
function chan(){if(isDM())return dmv();const c=C(cur);
 let h=`<header><h1>${pre(c)} ${c.n} <small>⌄</small></h1><span class=d>${c.d}</span><button class=m onclick="pane={k:'mem',id:'${c.id}'};render()">👥 ${c.h.length+c.a.length}</button></header><nav class=tabs><a class="${tab=='msg'?'on':''}" onclick="tab='msg';render()">💬 Messages</a>${cur=='inq'?`<a class="${tab=='list'?'on':''}" onclick="tab='list';render()">📋 문의대장</a>`:''}</nav>`;
 const intro=`<div class=intro><div class=ic>${pre(c)}</div><h2>${pre(c)} ${c.n}</h2><p>${c.d} · ${c.h.length} members · ${c.a.length} apps${c.p?' · Private':''}</p></div>`;
 return h+`<div class=feed>${tab=='list'?list():intro+feed(M[cur])}</div>`+comp(`Message ${pre(c)}${c.n}`)}
function pane2(){const p=$('#pane');if(!pane){p.hidden=true;return}p.hidden=false;
 if(pane.k=='mem'){const c=C(pane.id);p.innerHTML=`<header><h1 style="font-size:16px">${pre(c)}${c.n} · Members</h1><button class=x onclick="pane=null;render()">✕</button></header><div class=feed>${c.h.concat(c.a).map(k=>`<div class=msg>${av(k,28)}<div class=bd><b>${E(N(k))}</b>${A[k]?'<span class=ap>APP</span>':''}<div class=tm style="margin:0">${E(A[k]?(A[k][4]||'연동 (모의)'):P[k][1])}</div></div></div>`).join('')}</div>`;return}
 let pm,pc;for(const k in M){const m=M[k].find(m=>m.th==pane.id);if(m){pm=m;pc=C(k);break}}
 const n=cnt(pane.id);p.innerHTML=`<header><h1 style="font-size:16px">Thread</h1><span class=d>${pre(pc)}${pc.n}</span><button class=x onclick="pane=null;render()">✕</button></header><div class=feed>${item(pane.id)}${msg(pm,1)}<div class=rc>${n} ${n==1?'reply':'replies'}</div>${feed(T[pane.id],1)}</div>`+comp('Reply…')}
function tourUI(){const t=$('#tour');t.hidden=!(demo&&tour);if(t.hidden)return;
 const sc=SC[tour.s],st=sc.steps[tour.i],last=tour.i==sc.steps.length-1;
 t.innerHTML=`<div class=tt>시나리오 ${tour.s+1}/${SC.length} · 장면 ${tour.i+1}/${sc.steps.length}<b>${E(sc.t)}</b><div class=dt>${sc.steps.map((_,j)=>`<i class="${j<=tour.i?'on':''}"></i>`).join('')}</div></div><div class=ts>${f(st.say)}</div><div class=tb><button onclick="stepTo(${tour.s},${tour.i-1})"${tour.i?'':' disabled'}>← 이전</button><button onclick="page(3)">목록</button><button class=p onclick="next()">${!last?'다음 →':tour.s<SC.length-1?'다음 시나리오 →':'제안으로 →'}</button></div>`}
function render(){
 $('#pages').innerHTML=PAGES.map((p,i)=>`<button class="${pi==i?'on':''}" onclick="page(${i})">${i+1} ${p}</button>`).join('');
 ['#q','#vw','#rs'].forEach(s=>$(s).hidden=!demo);$('#sp').hidden=demo;
 $('#deck').hidden=demo;$('#app').hidden=!demo;
 if(!demo){$('#tour').hidden=true;$('#deck').innerHTML=[pCover,pOne,pMoney,pDemo,pAsk,pTerms,pOnto][pi]()+`<div class=nx>${pi?`<button onclick="page(${pi-1})">← 이전</button>`:''}${pi<PAGES.length-1?`<button class=p onclick="page(${pi+1})">다음 →</button>`:''}</div>`;if(pi==2)calc();if(pi==6)sdfit();return}
 $('#who').value=who;$('#wav').innerHTML=av(who,20);rail();side();$('#main').innerHTML=chan();pane2();tourUI()}
$('#who').innerHTML=Object.keys(P).map(k=>`<option value=${k}>${E(N(k))}</option>`).join('');
$('#who').onchange=e=>{who=e.target.value;const c=C(cur);if((c&&!c.h.includes(who))||cur=='u:'+who){cur=home();pane=null}hl=null;render()};
document.onkeydown=e=>{const g=e.target.tagName;if(g=='INPUT'||g=='SELECT')return;const k=e.key;
 if(dk!=null){e.preventDefault();if(k=='Escape')docClose();else if(k=='ArrowRight')docOpen((dk+1)%DOCS.length);else if(k=='ArrowLeft')docOpen((dk+DOCS.length-1)%DOCS.length);return}
 if(demo){if(k=='Escape')return page(3);if(!tour)return;if(k=='ArrowRight'){e.preventDefault();next()}else if(k=='ArrowLeft'){e.preventDefault();tour.i&&stepTo(tour.s,tour.i-1)}return}
 if(k=='ArrowRight'){e.preventDefault();page(pi+1)}else if(k=='ArrowLeft'){e.preventDefault();page(pi-1)}};
onresize=()=>{if(!demo&&pi==6)sdfit();if(!demo&&pi==2&&!SIM.on)simDraw(0)};
render();
</script>
