<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SJ Dynamics · 발표자 화면</title>
<style>
:root{--bg:#141215;--pn:#1d1a1f;--fg:#f4eff5;--mut:#a39aa6;--ln:#2e2931;--ac:#e8b84a;--pu:#c49ad9;--ok:#7fcf9a;--bad:#f07a6a}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,sans-serif;display:grid;grid-template-rows:auto auto 1fr auto;height:100vh;overflow:hidden}
button{font:inherit;color:inherit;background:#2a252c;border:1px solid #3a343d;border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{background:#352f38}button.p{background:#5b2a63;border-color:#7a3d84}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--ln)}
header b{font-size:17px}header .sp{flex:1}
#tm{font:600 26px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.5px;cursor:pointer}
#tm.warn{color:var(--ac)}#tm.over{color:var(--bad)}#tm small{font:500 13px/1 -apple-system,sans-serif;color:var(--mut);margin-left:6px}
#clock{color:var(--mut);font-variant-numeric:tabular-nums}
#aud{font-size:14px;color:var(--mut);display:flex;align-items:center;gap:8px}
#aud i{width:9px;height:9px;border-radius:50%;background:#555;display:inline-block}
#aud.on i{background:var(--ok)}#aud.off2 i{background:var(--ac)}#aud.diff{color:var(--ac)}
nav{display:flex;gap:4px;padding:8px 18px;border-bottom:1px solid var(--ln);overflow-x:auto}
nav button{white-space:nowrap;font-size:14px;padding:5px 10px;background:none;border-color:transparent;color:var(--mut)}
nav button small{opacity:.7;margin-left:4px}
nav button.on{background:#3b2240;border-color:#6e3b78;color:var(--fg)}nav button.done{color:#cfc6d2}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0}
#cue{overflow-y:auto;padding:22px 34px 60px}
.meta{display:flex;gap:10px;align-items:center;color:var(--mut);font-size:14px;margin-bottom:6px}
.meta .opt{color:var(--ac);border:1px solid #6b5420;border-radius:6px;padding:0 6px}
h1{font-size:30px;line-height:1.25;margin:0 0 10px}
.show{display:inline-block;font-size:14px;color:var(--pu);border:1px solid #4c3355;border-radius:8px;padding:3px 10px;margin-bottom:16px}
.tip{color:#d9cfdc;background:#2a2316;border-left:3px solid var(--ac);padding:10px 14px;border-radius:6px;margin:0 0 18px;font-size:16px}
.say p{font-size:27px;line-height:1.6;margin:0 0 18px;max-width:1050px}
.say b{color:#ffd98a;font-weight:700}
.fill{background:#5b4a14;color:#ffe9a8;border-radius:5px;padding:0 6px}
.do{list-style:none;padding:0;margin:6px 0 18px}.do li{font-size:18px;color:var(--ac);margin:6px 0}.do li:before{content:"▸ "}
.ask{font-size:23px;line-height:1.55;padding-left:30px;margin:4px 0 18px}.ask li{margin:6px 0}
.note h3{font-size:15px;color:var(--mut);margin:18px 0 6px;font-weight:600}.note li{font-size:17px;margin:5px 0;color:#d6cdd9}
aside{border-left:1px solid var(--ln);overflow-y:auto;padding:16px 16px 40px;background:var(--pn)}
aside h3{font-size:13px;color:var(--mut);margin:18px 0 8px;font-weight:600;letter-spacing:.3px}aside h3:first-child{margin-top:0}
#nx{font-size:15px;color:#d6cdd9}#nx b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
#pf{display:grid;grid-template-columns:1fr 1fr;gap:6px}#pf button{text-align:left;font-size:14px;padding:6px 8px}#pf button kbd{color:var(--ac);margin-right:6px;font:600 13px ui-monospace,Menlo,monospace}
#qa details{border-bottom:1px solid var(--ln);padding:7px 0}#qa summary{cursor:pointer;font-size:14.5px}
#qa p{font-size:14.5px;color:#d6cdd9;margin:6px 0}#qa button{font-size:13px;padding:3px 8px}
footer{display:flex;gap:8px;align-items:center;padding:8px 18px;border-top:1px solid var(--ln);font-size:14px;color:var(--mut)}
footer .sp{flex:1}footer kbd{font:600 12px ui-monospace,Menlo,monospace;color:var(--fg);background:#2a252c;border:1px solid #3a343d;border-radius:4px;padding:1px 5px}
#msg{color:var(--ac)}
/* 청중 화면 (#aud) */
body.au{display:block;background:#000}
body.au iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
body.au #blank{position:fixed;inset:0;background:#0b0a0c;display:flex;align-items:flex-end;justify-content:flex-end;padding:28px;color:#3a333d;font:600 15px -apple-system,sans-serif}
body.au #hint{position:fixed;inset:0;background:rgba(10,8,12,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;font:600 24px/1.4 -apple-system,"Apple SD Gothic Neo",sans-serif;cursor:pointer;text-align:center}
body.au #hint small{font-size:15px;font-weight:500;color:#cbbfd0}
[hidden]{display:none!important}
</style>
</head>
<body>
<script>
// 발표자 화면: 노트북에 띄웁니다. "청중 화면 열기"를 누르면 같은 파일이 #aud 로 열려 외부 모니터용 화면이 됩니다.
// 청중 화면은 소개서(v5)와 실제 화면 페이지를 담고, 발표자 화면의 → ← 로 넘어갑니다.
const DECK='sjdynamics-intro-v5.html',PFU='sjdynamics-portfolio.html';
const PAGES=['오늘','흐름 하나','숫자','시연','제안','조건','부록 · 구조'];
const DOCN=['견적서','거래명세서','계산서 발행 요청','아침 보고'];
const PF0=[['felix','실적'],['mes','강의'],['station','SJ Station'],['steward','SJ Steward'],['docs','자료 · 문서 생성'],['org','저희 회사의 운영'],['apps','앱']];
const $=s=>document.querySelector(s);

// ---------- 대본 ----------
// show: 청중 화면에 띄울 것 {v:'deck',page} {v:'deck',tour:[시나리오,장면]} {v:'deck',page,doc} {v:'deck',page,sim:1} {v:'pf',open} {v:'blank'}
const SECS=[{t:'인사',m:[0,5]},{t:'오늘 순서',m:[5,10]},{t:'거래 한 건',m:[10,25]},{t:'흐름 하나',m:[25,30]},{t:'숫자',m:[30,38]},
 {t:'시연',m:[38,50]},{t:'제안',m:[50,54]},{t:'조건',m:[54,57]},{t:'마무리',m:[57,60]}];
const D=p=>({v:'deck',page:p}),T=(s,i)=>({v:'deck',tour:[s,i]});
const B=[
{s:0,h:'인사',show:D(0),say:['안녕하세요, SJ Dynamics 김태유입니다. 시간 내 주셔서 감사합니다.','저희를 한 줄로 말씀드리면, **시스템으로 성과를 만드는 회사**입니다.','프로그램을 설치하고 끝내지 않고, 대표님이 정한 숫자가 바뀌어야 저희 일이 끝납니다.']},
{s:0,h:'실적: 납기율 30% → 100%',show:{v:'pf',open:'felix'},say:['제가 이 일을 하게 된 경험 하나만 말씀드리겠습니다.','베트남 하이퐁의 철강 플랜지 공장에 생산관리 담당으로 들어갔을 때, **납기율이 30%**였습니다.','저는 개발자가 아니라 생산관리 담당자로서 ERP를 직접 만들었습니다. 공정 전체, 재고와 재공, 그리고 몬테카를로 시뮬레이션으로 생산계획을 자동으로 세웠습니다.','2021년에 **납기율이 100%**가 됐습니다. 도구를 사서 들인 게 아니라, 시스템을 만들어 낸 성과였습니다.']},
{s:0,h:'강의',opt:'교육 이야기가 나오거나 시간이 넉넉할 때만',show:{v:'pf',open:'mes'},say:['올해는 중소벤처기업진흥공단 연수원의 AI 스마트공장 MES 실무 과정에서 둘째 날 여섯 시간을 맡아 강의했습니다.','스마트공장 추진 담당자와 제조 전문가분들께, 공정 조건으로 품질을 예측하고, 거꾸로 목표 품질에 맞는 조건을 찾는 법을 공장 데이터로 직접 실습하게 했습니다.']},
{s:1,h:'오늘 순서 네 가지',show:D(0),say:['오늘은 네 가지를 같이 하려고 합니다.','첫째, 회사의 **실제 거래 한 건**을 회사 화면으로 같이 따라가 봅니다.','둘째, 한 달에 몇 건, 한 건에 몇 분 드는지 세고 **시범할 흐름을 하나** 고릅니다.','셋째, 그 시간이 **돈으로 얼마인지** 회사 숫자로 봅니다.','넷째, 한 달 시범의 범위와 조건을 보고 **시작일**을 정합니다.']},
{s:1,h:'원칙 세 가지',show:D(0),say:['저희가 일하는 원칙은 세 가지입니다.','**성공 기준은 대표님이 정합니다.** 무엇을 성공으로 볼지 정해 주시면, 저희는 그 숫자로만 평가받겠습니다.','**작게 시작해서 숫자로 확인합니다.** 흐름 하나, 한 달. 시작 전과 같은 방법으로 재서 비교합니다.','**지금 쓰시는 도구는 그대로 둡니다.** ERP, 엑셀, 지금 쓰시는 AI 도구 모두 그대로입니다. 저희는 그걸 서로 잇고, 매일 돌아가게 운영합니다.']},
{s:2,h:'최근 주문 한 건 따라가기',show:{v:'blank'},tip:'듣는 시간입니다. 청중 화면은 가려 두고, 대표님 화면(ERP, 엑셀, 휴대폰 카톡)을 같이 보며 따라갑니다. 해결책 이야기는 아직 하지 않습니다.',
 say:['최근에 들어온 주문 하나만 처음부터 끝까지 같이 따라가 봐도 될까요?'],
 ask:['그 주문은 어디로 처음 들어왔나요? 전화, 카톡, 문자, 홈페이지, SNS 중에서요.','받은 분이 다음에 누구한테, 어떻게 넘기나요?','견적이나 가격 안내는 누가 무엇을 보고 하나요? 가격표는 어디에 있나요?','주문이 확정되면 ERP에는 누가 입력하나요? 같은 내용을 다른 곳에 또 적나요?','세금계산서는 누가 끊고, 입금 확인은 누가 어떻게 하나요?','출고와 배송은 누가 접수하나요? 재고는 어디서 줄이나요?','이 중에서 시간이 제일 많이 드는 곳은 어디인가요? 한 건에 몇 분쯤 걸리나요?','최근에 실수가 난 적이 있나요? 단가, 수량, 계산서 누락, 입금 확인 전 출고 같은 것들요. 그때는 어떻게 수습하셨나요?','이게 줄어들면 그 시간에 무엇을 하시겠어요?']},
{s:2,h:'정리해서 확인',show:{v:'blank'},say:['말씀하신 걸 정리하면, [들어오는 곳] → [견적] → [확정·입력] → [계산서·입금] → [출고] 순서이고,','시간이 가장 많이 드는 곳은 [ ]이네요. 맞나요?']},
{s:3,h:'흐름 하나 고르기',show:D(1),say:['모든 사업이 같은 흐름을 쓰지만, 시작은 한 곳에서 합니다.','방금 따라간 흐름에 한 달 몇 건, 한 건 몇 분을 같이 적어 보겠습니다.','시간이 가장 많이 드는 곳, 아니면 대표님이 가장 먼저 보고 싶은 곳으로 **하나만** 고르시면 됩니다.'],
 do:['청중 화면에서 건수와 분 칸을 같이 채웁니다 → 한 달 사람 시간이 바로 나옵니다','"✓ 이 흐름으로 시범"을 누릅니다'],
 note:['조직 AX 계획 → 흐름 하나가 자리 잡으면 다음 흐름으로 넘어갑니다. 그게 쌓이면 AX 조직이 됩니다. (실제 화면 "저희 회사의 운영"을 같이 보여도 됨)','사내에서 직접 만든 계산·설계 도구 → 기준 사례를 정해 두고, 고칠 때마다 다시 검사하고, 이전 버전으로 되돌릴 수 있게 합니다.','AI 구독, 부서끼리 같이 쓰기 → 누가 어떤 일에 쓰는지부터 보고 같이 정리하겠습니다.']},
{s:4,h:'성과는 결국 돈',show:D(2),say:['대표님이 원하시는 성과는 결국 돈이라고 생각합니다.','사람을 더 뽑지 않고 매출을 키우는 구조, 즉 **더 팔고, 덜 새고, 덜 드는** 구조입니다. 무엇을 잴지는 회사가 정합니다.']},
{s:4,h:'한 달을 20초로',show:{v:'deck',page:2,sim:1},say:['점 하나가 주문 한 건입니다. 한 달 동안 주문이 어디서 쌓이는지 20초로 보여 드립니다.','단계마다 걸리는 시간은 지금은 가정이고, 실제 시간은 오늘 같이 잽니다.'],do:['시뮬레이터가 자동으로 돕니다. 다시 돌리려면 청중 화면의 "▶ 한 달을 20초로"를 누릅니다']},
{s:4,h:'회사 숫자로',show:D(2),do:['청중 화면의 노란 칸을 회사 숫자로 바꿉니다: 한 달 건수, 한 건 시간(지금 → 목표), 시간당 인건비, 순이익률'],
 say:['예시 숫자로는 한 달에 **63시간**, 사람 0.3명분이 줄어듭니다.','1년이면 같은 일을 사람을 더 뽑아서 할 때 **1,875만 원**이 들고, 순이익률이 5%라면 이 이익을 매출로 내려면 **3.8억 원**을 더 팔아야 하는 셈입니다.','회사 숫자로는 [ ]시간, [ ]원입니다. 그리고 여기 **목표 칸이 시범의 성공 기준**이 됩니다.','한 가지 솔직하게 말씀드리면, 아낀 시간이 돈이 되려면 일이 늘어도 사람을 더 뽑지 않거나, 그 시간을 영업에 쓰셔야 합니다.'],
 tip:'아래의 더 팔기 · 덜 새기 · 덜 들기는 대표님이 관심을 보이는 줄만 청중 화면에서 "시연 →"으로 엽니다.'},
{s:5,h:'시연 소개',show:D(3),say:['앞에서 본 거래 한 건이 이렇게 바뀝니다.','화면 속 회사, 거래처, 금액은 모두 예시입니다.']},
{s:5,h:'시나리오 1 · ② 문의',show:T(0,0),say:['대표님이 받은 주문 전화도 **문의대장에 한 줄만** 남기면 거래가 시작됩니다.','중복 확인과 담당 배정은 AI가 합니다.']},
{s:5,h:'시나리오 1 · ③④ 견적',show:T(0,1),say:['가격표와 재고 시트를 근거로 견적서 초안이 나옵니다.','**금액은 코드가 계산하고, AI는 문장만 씁니다.**'],do:['청중 화면에서 📄 견적서를 눌러 실제 문서를 보여 줍니다']},
{s:5,h:'시나리오 1 · ⑤ 확정',show:T(0,2),say:['확정은 한 번이면 됩니다. ERP 입력, 계산서 요청, 입금 요청 문자가 이어서 나갑니다.','지금 사람 손이 가장 많이 가는 곳입니다.']},
{s:5,h:'시나리오 1 · ⑧⑨ 계산서 · 입금',show:T(0,3),say:['회계 담당은 근거가 붙은 요청을 보고 발행하고, 입금 알림은 계산서와 자동으로 맞춰 봅니다.','단톡방에서 다시 묻지 않습니다.']},
{s:5,h:'시나리오 1 · ⑥⑦ 출고 · 명세서',show:T(0,4),say:['**입금이 확인돼야 출고됩니다.**','재고가 줄고, 명세서는 실제 출고량과 맞춰 본 뒤 나갑니다.']},
{s:5,h:'시나리오 1 · ⑩ 마감',show:T(0,5),say:['마감까지 거래 한 건이 스레드 하나에 남습니다.','모든 거래가 어느 단계인지 한눈에 보입니다.']},
{s:5,h:'시나리오 2 · 아침 보고',opt:'시간이 되면',show:T(1,0),say:['매일 아침 8시, 매출, 새 문의, 승인 대기, 입금 대기, 오늘 출고를 **한 장으로** 받으십니다.']},
{s:5,h:'시나리오 2 · 묻고 답하기',opt:'시간이 되면',show:T(1,1),say:['궁금한 건 바로 물으시면 됩니다. 답에는 근거가 된 대화가 붙습니다.']},
{s:5,h:'시나리오 2 · 미입금',opt:'시간이 되면',show:T(1,2),say:['입금이 늦은 건은 출고를 보류하고 날짜를 셉니다.','재요청 문자는 회계 담당이 확인하고 보냅니다.']},
{s:5,h:'시나리오 3 · 권한',opt:'보안 질문이 나오면',show:T(2,0),say:['영업 직원이 입금 여부를 물어도, AI는 그 직원이 **볼 수 없는 채널 내용은 말하지 않습니다.**']},
{s:5,h:'시나리오 3 · 인수인계',opt:'퇴사 · 인수인계 질문이 나오면',show:T(2,1),say:['담당자가 휴가를 가거나 바뀌어도 지난 조건과 회사 기준이 근거와 함께 나옵니다.','**회사의 기억이 사람과 함께 나가지 않습니다.**']},
{s:5,h:'문서 · 견적서',show:{v:'deck',page:3,doc:0},say:['고객과 회계에 나가는 문서 세 장과, 대표님이 매일 받는 보고 한 장입니다.','숫자가 어디서 왔는지 옆에 붙어서 나갑니다.']},
{s:5,h:'문서 · 거래명세서',show:{v:'deck',page:3,doc:1},say:['명세서는 실제 출고량과 맞춰 본 뒤 나갑니다.']},
{s:5,h:'문서 · 계산서 발행 요청',show:{v:'deck',page:3,doc:2},say:['회계 담당은 근거가 붙은 요청을 보고 발행만 하면 됩니다.']},
{s:5,h:'문서 · 아침 보고',show:{v:'deck',page:3,doc:3},say:['대표님은 이 한 장을 매일 아침 받으십니다.']},
{s:6,h:'범위 · 결과물 · 성공 기준',show:D(4),say:['한 달 동안 **실제 주문으로** 확인해 보겠습니다.','**범위**는 방금 고른 흐름 하나입니다. 홍보, 문의, 견적, 확정과 입금, 출고, 명세서와 마감까지입니다. 다른 사업은 이 흐름이 자리 잡은 뒤에 붙입니다.','**결과물**은 매일 아침 8시에 받으시는 보고 한 장입니다. 숫자마다 근거가 붙습니다.','**성공 기준**은 대표님이 정하신 숫자입니다. 예를 들어 한 건 40분을 15분으로, 다시 입력하는 일은 0건으로요. 시작 전과 같은 방법으로 재고, 그 값이 아침 보고에 같이 올라갑니다.']},
{s:6,h:'진행 세 단계',show:D(4),say:['진행은 세 단계입니다.','**시작 전**에는 기준을 같이 정하고 지금 걸리는 시간을 잽니다. 가격표, 재고 시트, 그리고 사람이 확인할 곳 10군데입니다.','**한 달 동안**은 지금 쓰시는 도구를 그대로 두고 실제 주문으로 돌립니다.','**끝나면** 같은 방법으로 다시 재서, 성공 기준과 비교하고 다음 단계를 정합니다.']},
{s:7,h:'비용 · 준비할 것',show:D(5),say:['시범도 유료입니다. 한 달 시범 금액은 [금액: 대표님 결정 후 기입]입니다.','금액은 지금 단계만 말씀드리겠습니다.','준비해 주실 것은 세 가지입니다. 실제 문의와 견적 샘플, ERP 연동 권한, 그리고 담당자 한 분입니다.']},
{s:7,h:'하지 않는 것 · 서버',show:D(5),say:['하지 않는 것도 분명히 말씀드립니다.','공장과 설비 자동화는 이번 범위가 아닙니다. **AI는 금액을 정하지 않습니다.** 금액은 가격표로 계산하고 사람이 승인합니다. 지금 쓰시는 도구를 바꾸라고 하지 않습니다. 지원은 평일 저녁과 주말에 합니다.','시범 동안은 저희 서버에서 운영하고, 정식 계약 때는 서울의 관리형 서버로 옮기거나 회사 서버에 직접 설치합니다. 직접 설치는 견적을 따로 드립니다.']},
{s:7,h:'다음 단계',show:D(5),say:['처음 만든 흐름이 다른 사업의 틀이 됩니다.','지금 흐름 다음에 다른 제품과 사업, 그다음 설계와 생산 단계, 이후에는 새 법인이나 지점도 처음부터 같은 구조로 시작할 수 있습니다.']},
{s:8,h:'오늘 정할 세 가지',show:D(5),say:['오늘 정할 것은 세 가지입니다. **흐름 하나, 성공 기준, 시작일.**','흐름은 [ ], 성공 기준은 [ ]으로 하고, 시작일은 언제가 좋으실까요?']},
{s:8,h:'정하지 못하면',opt:'오늘 정하지 못할 때',show:D(5),say:['그러면 [날짜]까지 실제 문의·견적 샘플을 보내 주시면, 그 숫자로 성공 기준 초안을 만들어 [날짜]에 다시 말씀드리겠습니다.']}];
const QA=[
{q:'AI가 틀리면요?',a:'금액, 대조, 상태는 코드가 정합니다. AI는 초안만 쓰고, 정하는 건 사람입니다. 사람이 확인하는 곳이 10군데 있습니다.',show:D(6),w:'부록 · 구조'},
{q:'ERP를 바꿔야 하나요?',a:'아니요. 지금 쓰시는 도구는 그대로 두고 그 사이를 잇습니다.',show:D(6),w:'부록 · 구조'},
{q:'직원끼리 아무나 다 보게 되나요?',a:'채널 멤버만 봅니다. AI도 같은 권한을 따릅니다.',show:T(2,0),w:'시나리오 3'},
{q:'담당자가 그만두면요?',a:'지난 조건과 회사 기준이 근거와 함께 남습니다.',show:T(2,1),w:'시나리오 3'},
{q:'데이터는 어디에 있나요?',a:'시범은 저희 서버, 정식 계약 때는 서울의 관리형 서버나 회사 서버입니다.',show:D(5),w:'조건'},
{q:'협업 도구가 먼저 있어야 하지 않나요?',a:'그것도 저희가 만들어 매일 씁니다.',show:{v:'pf',open:'station'},w:'SJ Station'},
{q:'홈페이지, SNS 문의가 흩어져 있어요',a:'어디로 들어온 문의든 받은편지함 하나로 모으고, AI 상담원이 먼저 답합니다.',show:{v:'pf',open:'steward'},w:'SJ Steward'},
{q:'보고서, 견적서도 AI가 만드나요?',a:'지금 보신 소개 자료도 저희가 만든 겁니다. 숫자는 코드가 계산하고, AI는 문장만 씁니다.',show:{v:'pf',open:'docs'},w:'자료 · 문서'},
{q:'직원들도 AI를 쓸 수 있을까요?',a:'강의 경험을 이야기합니다.',show:{v:'pf',open:'mes'},w:'강의'},
{q:'AI 이사, AX 조직은 어떻게?',a:'저희 회사도 대표 한 명과 AI 임원으로 운영합니다. AI가 조사하고 초안을 만들고, 결정은 대표가 합니다.',show:{v:'pf',open:'org'},w:'회사 운영'},
{q:'가격은요?',a:'한 달 시범은 [ ]입니다. 금액은 지금 단계만 드립니다.',show:D(5),w:'조건'},
{q:'다른 사업도 되나요?',a:'흐름은 같고 계산 규칙과 배송만 다릅니다. 첫 흐름이 자리 잡은 뒤에 붙입니다.',show:D(5),w:'조건'}];

const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>E(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\[([^\]]*)\]/g,'<span class=fill>[$1]</span>');
function label(sh){if(!sh)return'';if(sh.v=='blank')return'화면 가림 (B)';
 if(sh.v=='pf')return'실제 화면 · '+((pfItems().find(x=>x[0]==sh.open)||[,sh.open])[1]);
 if(sh.tour)return`시연 · 시나리오 ${sh.tour[0]+1} 장면 ${sh.tour[1]+1}`;
 return`소개서 ${sh.page+1}쪽 · ${PAGES[sh.page]}`+(sh.doc!=null?` · 문서 ${DOCN[sh.doc]}`:'')+(sh.sim?' · ▶ 시뮬레이터':'')}

// ---------- 청중 화면 ----------
function audience(){
 document.title='SJ Dynamics';document.body.className='au';
 document.body.innerHTML=`<iframe id=deck src="${DECK}"></iframe><iframe id=pf src="${PFU}" hidden></iframe><div id=blank hidden>SJ Dynamics</div>
<div id=hint>이 창을 외부 모니터로 옮긴 뒤, 아무 곳이나 누르면 전체 화면이 됩니다<small>조종은 발표자 화면에서 합니다 · F 전체 화면</small></div>`;
 const F={deck:$('#deck'),pf:$('#pf')},st={deck:null,pf:null},last={deck:null,pf:null};let view='deck',blank=false;
 const up=()=>opener&&opener.postMessage({sjAud:{view,blank,deck:st.deck,pf:st.pf}},'*');
 const fwd=(v,m)=>F[v].contentWindow.postMessage({sj:1,...m},'*');
 addEventListener('message',e=>{const m=e.data;if(!m||typeof m!='object')return;
  if(m.sjState){const v=e.source===F.deck.contentWindow?'deck':e.source===F.pf.contentWindow?'pf':null;if(!v)return;
   const first=!st[v];st[v]=m.sjState;if(first&&last[v])fwd(v,last[v]);up();return}
  if(e.source!==opener)return;
  if(m.sjHello)up();
  if(m.sjBlank!=null){blank=m.sjBlank;$('#blank').hidden=!blank;up()}
  if(m.sjShow){const s=m.sjShow;if(s.v=='blank')blank=true;else{blank=false;view=s.v;last[view]=s;fwd(view,s);F.deck.hidden=view!='deck';F.pf.hidden=view!='pf'}
   $('#blank').hidden=!blank;up()}});
 const full=()=>{$('#hint').hidden=true;document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{})};
 $('#hint').onclick=full;
 addEventListener('keydown',e=>{if(e.key=='f'||e.key=='F')full();else fwd(view,{key:e.key})});
 up()}

// ---------- 발표자 화면 ----------
let cur=0,aud=null,S=null,detour=false,quiet=0,t0=null,acc=0;
const post=m=>{if(aud&&!aud.closed)aud.postMessage(m,'*')};
const pfItems=()=>S&&S.pf&&S.pf.items?S.pf.items:PF0;
function el(){return(acc+(t0?Date.now()-t0:0))/1000}
function go(i,send=true){cur=Math.max(0,Math.min(i,B.length-1));if(send){detour=false;quiet=Date.now()+1500;post({sjShow:B[cur].show})}draw()}
function side(sh){detour=true;quiet=Date.now()+1500;post({sjShow:sh});status()}
function match(sh,s){if(!s)return false;if(sh.v=='blank')return s.blank;if(s.blank||sh.v!=s.view)return false;
 if(sh.v=='pf')return!!(s.pf&&s.pf.k==sh.open);const d=s.deck;if(!d)return false;
 if(sh.tour)return!!(d.demo&&d.tour&&d.tour.s==sh.tour[0]&&d.tour.i==sh.tour[1]);
 if(sh.doc!=null)return d.dk==sh.doc;return!d.demo&&d.pi==sh.page&&d.dk==null}
function audLabel(s){if(!s)return'청중 화면 없음';if(s.blank)return'청중 화면: 가림';
 if(s.view=='pf'){const k=s.pf&&s.pf.k;return'청중 화면: 실제 화면'+(k?' · '+((pfItems().find(x=>x[0]==k)||[,k])[1]):' · 전체 보기')}
 const d=s.deck;if(!d)return'청중 화면: 여는 중';if(d.demo&&d.tour)return`청중 화면: 시연 ${d.tour.s+1}-${d.tour.i+1}`;
 return`청중 화면: 소개서 ${d.pi+1}쪽 ${PAGES[d.pi]}`+(d.dk!=null?` · ${DOCN[d.dk]}`:'')}
function status(){const a=$('#aud'),on=aud&&!aud.closed&&S;a.className=on?(match(B[cur].show,S)?'on':'diff'):'';
 a.innerHTML=`<i></i>${E(on?audLabel(S):'청중 화면 없음')}${on&&!match(B[cur].show,S)?' · 대본과 다름 (Esc로 맞추기)':''}`}
function draw(){const b=B[cur],sec=SECS[b.s],inSec=B.filter(x=>x.s==b.s),k=inSec.indexOf(b)+1;
 $('nav').innerHTML=SECS.map((x,i)=>`<button class="${i==b.s?'on':i<b.s?'done':''}" onclick="go(${B.findIndex(y=>y.s==i)})">${i+1} ${x.t}<small>${x.m[0]}–${x.m[1]}분</small></button>`).join('');
 $('#cue').innerHTML=`<div class=meta><span>${b.s+1} ${sec.t} · ${k}/${inSec.length}</span><span>계획 ${sec.m[0]}–${sec.m[1]}분</span>${b.opt?`<span class=opt>선택 · ${E(b.opt)}</span>`:''}</div>
<h1>${E(b.h)}</h1><div class=show>보여 주는 화면 · ${E(label(b.show))}</div>
${b.tip?`<div class=tip>${fmt(b.tip)}</div>`:''}
<div class=say>${(b.say||[]).map(x=>`<p>${fmt(x)}</p>`).join('')}</div>
${b.ask?`<ol class=ask>${b.ask.map(x=>`<li>${fmt(x)}</li>`).join('')}</ol>`:''}
${b.do?`<ul class=do>${b.do.map(x=>`<li>${fmt(x)}</li>`).join('')}</ul>`:''}
${b.note?`<div class=note><h3>질문이 나오면 조언으로 답하기</h3><ul>${b.note.map(x=>`<li>${fmt(x)}</li>`).join('')}</ul></div>`:''}`;
 $('#cue').scrollTop=0;const n=B[cur+1];
 $('#nx').innerHTML=n?`<b>${E(n.h)}${n.opt?' · 선택':''}</b>${fmt((n.say||[''])[0])}`:'<b>끝</b>';
 status();tick()}
function pfDraw(){$('#pf').innerHTML=pfItems().map(([k,nm],i)=>`<button onclick="side({v:'pf',open:'${k}'})"><kbd>${i}</kbd>${E(nm)}</button>`).join('')}
function tick(){const s=el(),m=Math.floor(s/60),t=$('#tm'),end=SECS[B[cur].s].m[1];
 t.innerHTML=`${String(m).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}<small>${t0?'':acc?'멈춤':'T 시작'}</small>`;
 t.className=!t0&&!acc?'':m>=end?'over':m>=end-1?'warn':'';
 $('#clock').textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
function timer(){if(t0){acc+=Date.now()-t0;t0=null}else t0=Date.now();tick()}
function flash(s){$('#msg').textContent=s;setTimeout(()=>$('#msg').textContent='',6000)}
async function openAud(){let f='popup,width=1280,height=760';
 try{if('getScreenDetails' in window){const d=await getScreenDetails(),o=d.screens.find(x=>x!==d.currentScreen);
  if(o)f=`popup,left=${o.availLeft},top=${o.availTop},width=${o.availWidth},height=${o.availHeight}`}}catch(e){}
 const w=open(location.href.split('#')[0]+'#aud','sjaud',f);if(!w)return flash('팝업이 막혔습니다. 한 번 더 눌러 주세요.');aud=w;S=null;status()}
function presenter(){
 document.body.insertAdjacentHTML('beforeend',`<header><b>SJ Dynamics</b><span style="color:var(--mut)">발표자 화면</span><span class=sp></span>
<span id=aud></span><button class=p onclick="openAud()">청중 화면 열기</button><span id=clock></span><span id=tm onclick="timer()" title="T: 시작 · 멈춤"></span></header>
<nav></nav><main><section id=cue></section><aside><h3>다음</h3><div id=nx></div><h3>실제 화면 · 숫자 키</h3><div id=pf></div>
<h3>질문이 나오면</h3><div id=qa>${QA.map((x,i)=>`<details><summary>${E(x.q)}</summary><p>${fmt(x.a)}</p><button onclick="side(QA[${i}].show)">청중 화면에 ${E(x.w)}</button></details>`).join('')}</div></aside></main>
<footer><button onclick="go(cur-1)">← 이전</button><button class=p onclick="go(cur+1)">다음 →</button><button onclick="post({sjBlank:!(S&&S.blank)})">B 가리기</button><button onclick="go(cur)">Esc 대본 위치로</button>
<span id=msg></span><span class=sp></span><span><kbd>→</kbd> <kbd>Space</kbd> 다음 · <kbd>←</kbd> 이전 · <kbd>0</kbd>–<kbd>9</kbd> 실제 화면 · <kbd>B</kbd> 가리기 · <kbd>Esc</kbd> 대본 위치로 · <kbd>T</kbd> 타이머</span></footer>`);
 addEventListener('message',e=>{const m=e.data;if(!m||!m.sjAud)return;if(!aud||aud.closed)aud=e.source;
  const first=!S;S=m.sjAud;if(first)post({sjShow:B[cur].show});
  if(!detour&&Date.now()>quiet&&!S.blank&&S.view=='deck'&&S.deck&&!match(B[cur].show,S)){let j=-1;
   B.forEach((b,i)=>{if(b.show.v=='deck'&&match(b.show,S)&&(j<0||Math.abs(i-cur)<Math.abs(j-cur)))j=i});if(j>=0)return go(j,false)}
  pfDraw();status()});
 addEventListener('keydown',e=>{const k=e.key;if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(k=='ArrowRight'||k=='PageDown'||k==' '){e.preventDefault();go(cur+1)}
  else if(k=='ArrowLeft'||k=='PageUp'){e.preventDefault();go(cur-1)}
  else if(k=='b'||k=='B'||k=='.')post({sjBlank:!(S&&S.blank)});
  else if(k=='Escape')go(cur);
  else if(k=='t'||k=='T')timer();
  else if(/^[0-9]$/.test(k)){const it=pfItems()[+k];if(it)side({v:'pf',open:it[0]})}});
 setInterval(()=>{tick();if(aud&&aud.closed){aud=null;S=null;status()}},1000);
 pfDraw();draw()}
location.hash=='#aud'?audience():presenter();
</script>
</body>
